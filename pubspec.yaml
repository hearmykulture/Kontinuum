name: kontinuum
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

  # Networking
  http: ^1.2.2

  # Plaid Link
  plaid_flutter: ^4.1.0

  collection: ^1.17.0
  characters: ^1.3.0
  auto_size_text: ^3.0.0
  animations: ^2.0.8

  # 🎯 App Core
  provider: ^6.0.5
  intl: ^0.18.1
  uuid: ^4.0.0
  cupertino_icons: ^1.0.8
  flutter_colorpicker: ^1.0.4
  fl_chart: ^0.65.0
  visibility_detector: ^0.4.0

  # 💾 Local Persistence
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5

  # 🎧 Audio (short SFX)
  soundpool: ^2.3.0

  file_picker: ^10.2.3
  just_waveform: ^0.0.5

  # 🔐 Permissions & Device Info
  permission_handler: ^11.0.0
  device_info_plus: ^9.0.0
  path: ^1.8.3

  # ✨ Lottie animations
  lottie: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # 🔧 Hive Type Adapter Generator
  build_runner: ^2.4.6
  hive_generator: ^2.0.1

  # (Optional)
  dart_code_metrics: ^4.19.2

flutter:
  uses-material-design: true

  assets:
    - assets/cmudict.json
    - assets/lottie/confetti.json
    - assets/audio/complete_chime.wav
    - assets/audio/levelup.wav
